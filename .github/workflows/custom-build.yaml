name: custom-build

# 每天自动同步上游 + 构建带自定义功能的 Windows 包
on:
  schedule:
    - cron: '0 19 * * *'      # UTC 19:00 = 北京时间 03:00
  workflow_dispatch:

concurrency:
  group: custom-build
  cancel-in-progress: true

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.47.6'
  GO_VERSION: '1.27.1'
  PYTHONUTF8: '1'
  PYTHONIOENCODING: 'utf-8'

jobs:
  windows:
    name: Windows x64 (custom)
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Sync upstream (schedule only)
        if: github.event_name == 'schedule'
        shell: bash
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/chen08209/FlClash.git 2>/dev/null || true
          git fetch upstream main
          if git merge --no-edit upstream/main; then
            echo "upstream merged"
            git push origin HEAD:main
          else
            echo "merge conflict, keep current branch and build anyway" >&2
            git merge --abort || true
          fi

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: core/go.sum

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: custom-windows
          workspaces: |
            services/helper
            plugins/rust_api/rust
          cache-directories: .dart_tool/hooks_runner

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Enable git long paths
        run: git config --global core.longpaths true

      - name: Refresh submodules
        shell: bash
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive

      - name: Apply custom features
        run: python scripts/apply_custom.py

      - name: Fetch CA certificates
        shell: bash
        run: |
          bundle=core/Clash.Meta/component/ca/ca-certificates.crt
          if [ ! -f "$bundle" ]; then
            mkdir -p "$(dirname "$bundle")"
            curl -fsSL --retry 3 -o "$bundle" https://curl.se/ca/cacert.pem
          fi

      - name: Flutter pub get
        run: |
          flutter --version
          flutter pub get

      - name: Build
        run: dart setup.dart windows --env stable -v

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: flclash-windows-custom
          path: ./dist
          overwrite: true

      # 只替换 app.so 做就地升级时用这个，几十 MB，比整包快得多
      - name: Upload hot files (app.so + exe)
        uses: actions/upload-artifact@v4
        with:
          name: flclash-hotfiles
          path: |
            build/windows/**/runner/Release/FlClash.exe
            build/windows/**/runner/Release/data/app.so
            build/windows/**/runner/Release/data/icudtl.dat
          if-no-files-found: warn
          overwrite: true
